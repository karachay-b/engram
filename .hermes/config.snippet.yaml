# Engram auf Hermes Agent — die Blöcke für ~/.hermes/config.yaml
#
# NICHT diese Datei als config.yaml verwenden. Der Inhalt gehört in die bestehende
# ~/.hermes/config.yaml einsortiert: `skills:` und `hooks:` sind Top-Level-Schlüssel,
# und wer sie doppelt anlegt, verliert stillschweigend den ersten.
#
# <DU> überall durch den eigenen Benutzernamen ersetzen (macOS: /Users/<DU>,
# Linux: /home/<DU>). Die Übergabedatei .hermes/UEBERGABE-HERMES.md, Schritt 3,
# führt durch die Einrichtung.

skills:
  external_dirs:
    # Nur die Hermes-Aliase registrieren, NICHT ~/engram/skills.
    #
    # Zwei Gründe: `learn` ist der Name eines Hermes-Builtins (es baut neue Skills aus
    # Quellen) und lässt sich nicht überschreiben — der Upstream-Skill hieße also anders,
    # als überall dokumentiert steht. Und `review`/`coach` stünden doppelt im Index, einmal
    # mit und einmal ohne die Regeln dieses Forks. Die Upstream-Skills werden weiterhin
    # GELESEN (die Aliase verweisen auf ihren vollen Pfad), nur nicht registriert.
    - ~/engram/.hermes/skills

hooks:
  # Sessionstart: pullt den Lernstand, gibt das Briefing und den Fälligkeits-Nudge aus.
  # Feuert bei jedem LLM-Aufruf, tut aber nur beim ersten pro Session etwas.
  pre_llm_call:
    - command: "/Users/<DU>/engram/.hermes/hooks/session-start.sh"
      timeout: 120

  # Auto-Save: committet und pusht den Lernstand nach jedem Turn.
  # `post_llm_call` feuert einmal pro Turn, nachdem die Tool-Schleife durch ist —
  # das genaue Gegenstück zum Stop-Hook in Claude Code. Bei sauberem Baum ein No-Op.
  #
  # OHNE DIESEN HOOK bleibt der Lernstand auf dieser Platte liegen und Claude Code
  # sieht ihn nie. Er ist der Grund, warum beide Plattformen einen Kalender teilen.
  post_llm_call:
    - command: "/Users/<DU>/engram/.hermes/hooks/engram-save.sh"
      timeout: 120

# Beim ersten Feuern fragt Hermes je (Event, Kommando) einmal nach Zustimmung und merkt
# sie sich in ~/.hermes/shell-hooks-allowlist.json. Das ist gewollt — einmal bestätigen.
# Auf `true` nur setzen, wenn Hermes ohne Terminal laufen soll (Gateway, cron, CI);
# dann gilt die Zustimmung für JEDEN Shell-Hook, auch für später hinzukommende.
hooks_auto_accept: false
